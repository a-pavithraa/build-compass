<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project map</title>
<!--
  This page is the same for every project. It draws itself from map-data.js in the same folder.
  To change a milestone, a wording or a decision, edit map-data.js. Do not edit this file:
  it is replaced whenever the map is updated.
-->
<style>
:root{
  --accent:#3B82F6;
  --base:#fbfaf7;
  --ink:#171a21; --ink-2:#434a58; --ink-3:#5b6372;
  --done:#1c7447; --progress:#8f5d00; --todo:#5b6372; --stuck:#b8332a;
  --ground:color-mix(in oklab,var(--accent) 4%,var(--base));
  --surface:color-mix(in oklab,var(--accent) 2%,#ffffff);
  --raised:color-mix(in oklab,var(--accent) 9%,var(--base));
  --rule:color-mix(in oklab,var(--accent) 12%,#dcd9d0);
  --rule-strong:color-mix(in oklab,var(--accent) 22%,#bdb9ae);
  --accent-ink:color-mix(in oklab,var(--accent) 66%,#000000);
  --on-accent:#0b1020;
  --select:color-mix(in oklab,var(--accent) 13%,transparent);
  --hover:color-mix(in oklab,var(--ink) 4%,transparent);
  --done-t:color-mix(in oklab,var(--done) 14%,transparent);
  --progress-t:color-mix(in oklab,var(--progress) 16%,transparent);
  --stuck-t:color-mix(in oklab,var(--stuck) 13%,transparent);
  --shadow:color-mix(in oklab,var(--ink) 30%,transparent);
  --head:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --base:#07090e;
  --ink:#E7EDF9; --ink-2:#AEBBD3; --ink-3:#8796B3;
  --done:#3FCF8E; --progress:#F2B441; --todo:#8796B3; --stuck:#F47680;
  --ground:color-mix(in oklab,var(--accent) 8%,var(--base));
  --surface:color-mix(in oklab,var(--accent) 13%,var(--base));
  --raised:color-mix(in oklab,var(--accent) 19%,var(--base));
  --rule:color-mix(in oklab,var(--accent) 24%,#141821);
  --rule-strong:color-mix(in oklab,var(--accent) 36%,#1c212c);
  --accent-ink:color-mix(in oklab,var(--accent) 62%,#ffffff);
  --select:color-mix(in oklab,var(--accent) 19%,transparent);
  --shadow:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scrollbar-color:var(--rule-strong) var(--ground);scrollbar-width:thin}
::selection{background:color-mix(in oklab,var(--accent) 42%,transparent);color:var(--ink)}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);caret-color:var(--accent);accent-color:var(--accent);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer}
a{color:var(--accent-ink);text-underline-offset:3px}
a:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--head);font-weight:600;margin:0;text-wrap:balance;font-stretch:87%;letter-spacing:.005em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.i .cut{stroke:var(--ground)}
svg.i .fill{fill:currentColor;stroke:none}

.page{max-width:1440px;margin:0 auto;padding:0 40px 72px}
.fatal{max-width:60ch;margin:80px auto;padding:0 20px}
.fatal h1{font-size:26px;margin-bottom:8px}
.fatal p{color:var(--ink-2)}

.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;padding:16px 0 14px;border-bottom:1px solid var(--rule);color:var(--ink-3);font-size:13px}
.top .name{font-family:var(--head);font-size:19px;font-weight:700;color:var(--ink);font-stretch:87%;letter-spacing:.01em}
.top .name span{color:var(--ink-3);font-weight:400}
.top .sum{flex:1 1 320px;min-width:0}
.badge{display:inline-flex;align-items:center;gap:6px;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:600;box-shadow:inset 0 0 0 1px var(--rule-strong);color:var(--ink-2)}
.badge.wait{color:var(--progress);box-shadow:inset 0 0 0 1px var(--progress)}
.badge.ok{color:var(--done);box-shadow:inset 0 0 0 1px var(--done)}
.badge.new{color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent)}
.badge.gone{color:var(--stuck);box-shadow:inset 0 0 0 1px var(--stuck)}

.lead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;padding:22px 0 20px;align-items:start}
.lead h1{font-size:40px;line-height:1.08;font-weight:700}
.count{font:inherit;color:var(--accent-ink);border-bottom:2px solid var(--accent);padding-bottom:1px;border-radius:0;transition:color .15s,background .15s}
.count:hover{color:var(--ink);background:var(--select)}
.lead .sub{color:var(--ink-2);margin-top:12px;max-width:62ch}
.next h2{font-size:22px;line-height:1.2}
.next .kicker{font:600 13px/1.4 var(--body);color:var(--ink-3);margin-top:0}
.next p{color:var(--ink-2);margin-top:8px;max-width:60ch}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 14px;border-radius:7px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px;transition:background .15s}
.btn:hover{background:color-mix(in oklab,var(--accent) 86%,var(--ink))}
.btn.quiet{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-strong)}
.btn.quiet:hover{background:var(--select)}

/* The plan drawn as a strip of tasks, grouped by milestone. */
.sheet{padding-bottom:22px}
.ms{min-width:0;margin-top:22px}
.ms:first-child,.ms-note + .ms{margin-top:0}
.ms.shut + .ms.shut{margin-top:4px}
.ms-note{margin:0 2px 14px}
.ms-top{display:flex;align-items:flex-end;gap:14px;border-bottom:1px solid var(--rule-strong);margin-bottom:10px}
.ms-top:has(.ms-head.is-selected){border-bottom-color:var(--accent)}
.ms.shut .ms-top{align-items:baseline;margin-bottom:0;border-bottom-color:var(--rule)}
.ms.shut .ms-head{padding-top:8px}
.ms.shut .ms-head b{flex:0 1 auto}
.ms-toggle{flex:none;margin-bottom:5px;font-size:13px;white-space:nowrap}
.ms.shut .ms-toggle{margin-bottom:0}
.ms-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;flex:1;min-width:0;padding:0 2px 8px}
.ms-head b{flex:1 1 100%;font-family:var(--head);font-size:16px;font-weight:600;font-stretch:87%;text-wrap:balance}
.ms-head .tag{color:var(--ink-3);font-size:13px;white-space:nowrap}
.ms-head .tally{color:var(--ink-2);font-size:13px;white-space:nowrap}
.ms-head .tag + .tally{margin-left:auto}
.ms-head:hover b{text-decoration:underline;text-underline-offset:4px}
.ms-head.is-selected b{color:var(--accent-ink)}
.slots{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.slot{position:relative;display:flex;flex-direction:column;gap:3px;min-height:96px;padding:10px 12px;border-radius:8px;
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--rule);transition:box-shadow .15s,opacity .2s}
.slot:hover{box-shadow:inset 0 0 0 1px var(--ink-3)}
.slot .sid{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.slot .sname{font-weight:600;line-height:1.25;font-size:14.5px;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.slot .sstat{margin-top:auto;font-size:12.5px;color:var(--ink-2)}
.slot.done{background:linear-gradient(var(--done-t),var(--done-t)),var(--surface)}
.slot.done.unchecked{background:var(--surface)}
.slot.unchecked .sstat{color:var(--progress);font-weight:600}
.slot.in-progress{background:linear-gradient(var(--progress-t),var(--progress-t)),var(--surface)}
.slot.not-started{background:transparent;box-shadow:none;outline:1px dashed var(--rule-strong);outline-offset:-1px}
.slot.not-started:hover{outline-color:var(--ink-3)}
.slot.stuck{background:repeating-linear-gradient(135deg,var(--stuck-t) 0 7px,transparent 7px 14px),var(--surface)}
.slot.is-selected,.slot.is-selected:hover{box-shadow:inset 0 0 0 2px var(--accent),0 6px 18px -8px var(--accent);outline:0}
.slot:focus-visible,.slot.is-selected:focus-visible,.slot.is-selected:hover:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.dim{opacity:.28}

.g{display:inline-flex;vertical-align:-3px}
.g.done{color:var(--done)}.g.in-progress{color:var(--progress)}.g.not-started{color:var(--todo)}.g.stuck{color:var(--stuck)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:40px;align-items:start}
.stack > section + section{margin-top:22px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 0 10px;border-top:1px solid var(--rule)}
.sec-head h2{font-size:20px}
.sec-head .hint{color:var(--ink-3);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:999px;font-size:13px;color:var(--ink-2);
  box-shadow:inset 0 0 0 1px var(--rule-strong);transition:background .15s,color .15s}
.chip:hover{background:var(--raised);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--select);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.chip .n{color:var(--ink-3)}
.filterbar{display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:6px;border-radius:7px;background:var(--select);font-size:13.5px}
.filterbar button{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.filterbar button:hover{color:var(--ink)}

.prow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:6px 18px;align-items:start;padding:11px 10px;border-top:1px solid var(--rule);transition:background .15s}
.prow:first-of-type{border-top-color:transparent}
.prow:hover{background:var(--hover)}
.prow.is-selected{background:var(--select);box-shadow:inset 0 0 0 1px var(--accent);border-radius:7px;border-top-color:transparent}
.prow.is-selected + .prow{border-top-color:transparent}
.stat{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);white-space:nowrap;padding-top:1px}
.pname{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15.5px;text-align:left}
.pname svg{color:var(--ink-3);transition:transform .15s}
.pname:hover{text-decoration:underline;text-underline-offset:4px}
.pname:hover svg{transform:translateX(2px);color:var(--accent-ink)}
.preason{color:var(--ink-2);font-size:13.5px;margin-top:2px;max-width:78ch}
.pwait{color:var(--ink);font-size:13.5px;margin-top:4px;display:flex;gap:7px;align-items:flex-start}
.pwait svg{color:var(--stuck);margin-top:2px}
.pside{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.ptasks{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;padding-top:1px;max-width:260px}
.ptests{color:var(--ink-2);font-size:13px;text-align:right}
.ref{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:5px;font-family:var(--mono);font-size:12.5px;line-height:20px;
  color:var(--ink);background:var(--raised);box-shadow:inset 0 0 0 1px var(--rule-strong);white-space:nowrap;transition:box-shadow .15s,background .15s}
.ref svg.i{width:13px;height:13px}
.ref:hover{box-shadow:inset 0 0 0 1px var(--accent-ink)}
.ref.is-selected{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--select)}
.empty{padding:22px 10px;color:var(--ink-2);border-top:1px solid var(--rule)}

.dec{padding:12px 10px;border-top:1px solid var(--rule);display:block;width:100%;transition:background .15s}
.dec:first-of-type{border-top-color:transparent}
.dec:hover{background:var(--hover)}
.dec.is-selected{background:var(--select);box-shadow:inset 0 0 0 1px var(--accent);border-radius:7px}
.dec .q{display:flex;gap:8px;align-items:flex-start;font-weight:600}
.dec .q svg{margin-top:3px;color:var(--ink-3)}
.dec:hover .q svg{color:var(--accent-ink)}
.dec .d{display:block;color:var(--ink-2);font-size:13.5px;margin-top:3px}
.dec .d b{color:var(--ink);font-weight:600}
.find{padding:10px 10px;border-top:1px solid var(--rule)}
.find:first-of-type{border-top-color:transparent}
.find h3{font:600 14.5px/1.35 var(--body);font-stretch:100%;letter-spacing:0}
.find p{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.find .refs{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}

.crow{display:grid;grid-template-columns:92px 132px minmax(0,1fr) auto;gap:14px;padding:8px 10px;border-top:1px solid var(--rule);font-size:13.5px;align-items:center}
.crow:first-of-type{border-top-color:transparent}
.crow .when{color:var(--ink-3)}
.crow .un{color:var(--progress);font-size:12.5px;font-weight:600}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 64px 44px 44px;gap:10px;padding:6px 10px;border-top:1px solid var(--rule);font-size:13px}
.frow:first-of-type{border-top-color:transparent}
.frow .k{color:var(--ink-2)}
.frow .a,.frow .r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.frow .a{color:var(--done)}.frow .r{color:var(--stuck)}
.scope{padding:6px 10px;color:var(--ink-2);font-size:14px}
.scope ul{margin:6px 0 8px;padding-left:18px;color:var(--ink)}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px}
table.grid th{text-align:left;font-weight:600;color:var(--ink-3);padding:6px 10px;font-size:12.5px}
table.grid td{padding:8px 10px;border-top:1px solid var(--rule);vertical-align:top}
.tblwrap{overflow-x:auto}
.review{position:fixed;right:24px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:5;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;
  background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14.5px;box-shadow:0 12px 30px -12px var(--shadow),0 2px 6px -2px var(--shadow);transition:background .15s,transform .15s var(--ease)}
.review:hover{background:color-mix(in oklab,var(--accent) 86%,var(--ink))}
.review:active{transform:translateY(1px)}
body:has(.drawer.open) .review{right:calc(min(520px,100vw) + 24px)}
body:has(.drawer.open.answers) .review{display:none}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;width:100%;padding:10px 0;border-top:1px solid var(--rule);transition:background .15s}
.arow:first-of-type{border-top-color:transparent}
.arow:hover{background:var(--hover)}
.arow .aq{font-weight:600}
.arow .aa{grid-column:1;color:var(--ink-2);font-size:13.5px}
.arow .aa b{color:var(--ink);font-weight:600}
.arow .badge{grid-row:1;grid-column:2;white-space:nowrap}
.foot{margin-top:36px;padding-top:14px;border-top:1px solid var(--rule);color:var(--ink-3);font-size:13px;max-width:90ch}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--rule-strong);
  box-shadow:-28px 0 60px -20px var(--shadow);overflow-y:auto;padding:20px 26px 40px;z-index:10;
  transform:translateX(24px);opacity:0;visibility:hidden;transition:transform .26s var(--ease),opacity .2s var(--ease),visibility 0s .26s}
.drawer.open{transform:none;opacity:1;visibility:visible;transition:transform .26s var(--ease),opacity .2s var(--ease)}
.drawer.instant{transition:none}
.drawer:focus{outline:0}
.dhead{display:flex;align-items:flex-start;gap:12px}
.dhead .what{color:var(--ink-3);font-size:13px}
.dhead h2{font-size:25px;line-height:1.15;margin-top:2px}
.x{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:6px;color:var(--ink-2);font-size:13px;box-shadow:inset 0 0 0 1px var(--rule-strong);white-space:nowrap}
.x:hover{background:var(--raised);color:var(--ink)}
.dstat{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.dstat .stat{font-weight:600}
.dstat > span:not(.stat){display:inline-flex;align-items:center;gap:6px}
.drawer blockquote{margin:14px 0 0;padding:10px 12px;background:var(--ground);border-radius:7px;color:var(--ink);font-size:14px}
.drawer blockquote cite{display:block;font-style:normal;color:var(--ink-3);font-size:12.5px;margin-top:3px}
.drawer h3{font-size:16px;margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}
.drawer p.t{color:var(--ink-2);margin-top:8px;font-size:14px}
.drawer p.t b{color:var(--ink)}
.drawer ul.ev{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:14px}
.drawer ul.ev li{margin-top:4px}
.rgroup{font:600 13px/1.3 var(--body);font-stretch:100%;letter-spacing:0;color:var(--ink-3);padding:12px 10px 2px}
.rrow{display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 12px;align-items:start;padding:9px 10px;border-top:1px solid var(--rule)}
.rgroup + .rrow{border-top-color:transparent}
.rtext{font-weight:600}
.rwas,.rat{font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.rwas{color:var(--ink-2)}
.rat{color:var(--ink-3)}
.drawer .rrow{grid-template-columns:1fr;padding-left:0;padding-right:0}
.drawer .rrow:first-child{border-top-color:transparent}
@media (max-width:560px){.rrow{grid-template-columns:1fr}}
.calls{margin-top:10px;border-top:1px solid var(--rule)}
.call{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--rule)}
.call .fn{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.call .at{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.stack ul.ev{margin:0;padding:0;list-style:none;color:var(--ink-2);font-size:14px}
.stack ul.ev li{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--rule)}
.stack ul.ev svg{margin-top:3px;color:var(--done)}
.stack ul.ev li.failed svg{color:var(--stuck)}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 14px;margin:10px 0 0;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;display:flex;flex-wrap:wrap;gap:5px;align-items:center;color:var(--ink-2)}
.kv dd .strong{color:var(--ink)}
.wait{display:flex;gap:10px;margin-top:14px;padding:11px 12px;border-radius:7px;background:var(--stuck-t);font-size:14px}
.wait svg{color:var(--stuck);margin-top:3px}
.wait b{display:block}
.wait.unchecked{background:var(--progress-t)}
.wait.unchecked svg{color:var(--progress)}
.rec{margin-top:12px}
.rec + .rec{margin-top:18px;padding-top:16px;border-top:1px dashed var(--rule-strong)}
.state{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-radius:7px;font-size:14px}
.state svg{margin-top:3px}
.state.un{background:var(--progress-t);color:var(--ink)}
.state.un svg{color:var(--progress)}
.state.co{background:var(--ground);color:var(--ink-2)}
.state.co svg{color:var(--done)}
.state b{color:var(--ink)}
.rec p.desc{margin-top:9px;font-size:14px;color:var(--ink)}
table.files{width:100%;border-collapse:collapse;margin-top:9px;font-size:13px}
table.files td{padding:5px 0;border-top:1px solid var(--rule);vertical-align:top}
table.files td:first-child{overflow-wrap:anywhere}
table.files td.k{color:var(--ink-2);width:64px;padding-left:10px}
table.files td.a,table.files td.r{width:44px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.files td.a{color:var(--done)}table.files td.r{color:var(--stuck)}
table.files small{display:block;color:var(--ink-3);font-family:var(--body);font-size:12px}
.meta{color:var(--ink-3);font-size:12.5px;margin-top:8px}
fieldset{border:0;padding:0;margin:12px 0 0}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--rule-strong);margin-top:6px;cursor:pointer}
label.opt:hover{background:var(--raised)}
label.opt:has(input:checked){box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--select)}
label.opt input{margin-top:4px}
label.opt small{display:block;color:var(--ink-3);font-size:12.5px}
ul.opts{margin:10px 0 0;padding-left:18px;font-size:14px;color:var(--ink)}
ul.opts small{color:var(--ink-3)}
.paste{margin-top:14px;padding:12px;border-radius:7px;background:var(--ground)}
.paste code{display:block;font-family:var(--mono);font-size:13px;color:var(--ink);white-space:pre-wrap;word-break:break-word;user-select:all}
.paste .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:10px}
.paste .row .btn{margin-top:0;white-space:nowrap}
.paste > .msg{margin:0 0 10px}
.paste .msg{font-size:13px;color:var(--ink-2)}
.paste .msg.err{color:var(--stuck)}

@media (max-width:1100px){
  .main{display:flex;flex-direction:column;gap:22px}
  .main > .stack{display:contents}
  .main > .stack > section{margin-top:0;order:3;min-width:0}
  .main > .col-side > section{order:2}
  .main #parts{order:1}
  .lead{grid-template-columns:minmax(0,1fr);gap:22px}
}
@media (max-width:820px){
  .page{padding:0 16px 56px}
  .lead h1{font-size:30px}
  .slots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prow{grid-template-columns:minmax(0,1fr)}
  .pside{flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
  .ptasks{justify-content:flex-start;max-width:none}
  .legend{margin-left:0}
  .crow{grid-template-columns:92px minmax(0,1fr)}
  .crow .subj,.crow .cref{grid-column:1 / -1}
  .drawer{padding:18px 16px 36px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>
<div class="page" id="page"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Details" tabindex="-1"></aside>
<noscript><p style="padding:40px">This map needs JavaScript to draw itself. Its data is in map-data.js, next to this file.</p></noscript>

<script>
(function(){
  var page = document.getElementById('page');
  var params = new URLSearchParams(location.search);
  var dataFile = params.get('data') || 'map-data.js';
  if(!/^[\w./-]+\.js$/.test(dataFile) || dataFile.indexOf('..')>-1) dataFile = 'map-data.js';

  function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function arr(a){return Array.isArray(a)?a:[];}
  function plural(n,one,many){return n+' '+(n===1?one:many);}
  function lowerFirst(s){s=String(s||'');return s.charAt(0).toLowerCase()+s.slice(1);}
  function href(u){u=String(u||'');return /^(https?:\/\/|\.{0,2}\/|[\w.-]+\/|[\w.-]+$)/.test(u)&&!/^javascript:/i.test(u)?e(u):'#';}

  function fatal(title,text){
    page.innerHTML = '<div class="fatal"><h1>'+e(title)+'</h1><p>'+e(text)+'</p></div>';
  }
  function load(file, done, failed){
    var s = document.createElement('script');
    s.src = file + (file.indexOf('?')>-1?'&':'?') + 't=' + Date.now();
    s.onload = function(){ s.remove(); done(window.PROJECT_MAP); };
    s.onerror = function(){ s.remove(); if(failed) failed(); };
    document.head.appendChild(s);
  }
  function stamp(d){ var u=(d&&d.update)||{}; return [u.version,u.readAt,u.commit].join('|'); }

  load(dataFile, function(D){
    if(!D || typeof D!=='object' || !Array.isArray(D.parts)){
      fatal('The map has no data to draw', 'This page reads '+dataFile+' from the same folder, and that file is missing or not valid. Ask Claude to update the map.');
      return;
    }
    start(D);
    if(dataFile==='map-data.js'){
      var seen = stamp(D);
      setInterval(function(){ load(dataFile, function(n){ if(n && stamp(n)!==seen) location.reload(); }); }, 5000);
    }
  }, function(){
    fatal('The map has no data to draw', 'This page reads '+dataFile+' from the same folder, and that file is missing. Ask Claude to draw the map.');
  });

  function start(D){
    var style = D.style || {};
    var theme = style.theme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    if(/^#[0-9a-f]{3,8}$/i.test(style.accent||'')) document.documentElement.style.setProperty('--accent', style.accent);
    document.title = (D.project||'Project')+': project map';

    var U = D.update || {};
    var TASKS = arr(D.tasks), PARTS = arr(D.parts), MILES = arr(D.milestones), DECS = arr(D.decisions);
    var LABEL = {'done':'Done','in-progress':'In progress','not-started':'Not started','stuck':'Stuck'};
    var ORDER = ['done','in-progress','not-started','stuck'];
    function norm(o){ if(!LABEL[o.status]) o.status = 'not-started'; return o; }
    var byId = {};
    TASKS.forEach(function(t){byId[t.id]={type:'task',o:norm(t)};});
    PARTS.forEach(function(p){byId[p.id]={type:'part',o:norm(p)};});
    MILES.forEach(function(m){byId[m.id]={type:'milestone',o:m};});
    DECS.forEach(function(d){byId[d.id]={type:'decision',o:d};});
    /* Every answer the owner has given on this page, gathered in the drawer. Not an id from the data. */
    var ANSWERS = '@answers';
    byId[ANSWERS] = {type:'answers', o:{}};
    var state = {sel:null, filter:null, picks:{}, earlier:false, openMs:{}};
    var changed = arr(U.changed);

    /* Picks outlive the page's own reloads. A pick is kept only while its decision is still open
       and still offers that option, so an answer Claude has recorded clears itself. */
    function answerable(d){ return !d.answer && !d.readOnly; }
    /* A task the owner can check by hand: its work exists and no check is recorded. The result is a pick like any other. */
    var HAND = {passed:'It worked', failed:'It did not work'};
    function checkable(t){ return (t.status==='done' || t.status==='in-progress') && !arr(t.verified).some(function(v){return v.by!=='script';}); }
    var STORE = 'project-map:'+(D.project||'')+':'+location.pathname;
    try{
      var saved = JSON.parse(localStorage.getItem(STORE) || '{}');
      DECS.forEach(function(d){ if(answerable(d) && arr(d.options).indexOf(saved[d.id])>=0) state.picks[d.id] = saved[d.id]; });
      TASKS.forEach(function(t){ if(checkable(t) && HAND[saved[t.id]]) state.picks[t.id] = saved[t.id]; });
    }catch(x){ state.picks = {}; }
    function persist(){ try{ localStorage.setItem(STORE, JSON.stringify(state.picks)); }catch(x){ /* saving picks is a convenience only */ } }
    function answers(){
      var open = DECS.filter(answerable), picked = open.filter(function(d){return state.picks[d.id];});
      var lines = ['Map answers: '+(D.project||'Project')+' (map version '+(U.version||'?')+(U.readAtShort||U.readAt?', read '+(U.readAtShort||U.readAt):'')+')', ''];
      open.forEach(function(d){
        lines.push(shown(d)+'. '+d.question);
        lines.push('   -> '+(state.picks[d.id] || '(no answer; the default stands: '+(d['default']||'no default')+')'));
      });
      var hand = TASKS.filter(function(t){return checkable(t) && state.picks[t.id];});
      if(hand.length){
        lines.push('', 'Checked by hand at '+(U.commit||'an unknown commit')+(U.uncommittedWork?' plus uncommitted work':'')+':');
        hand.forEach(function(t){ lines.push(shown(t)+'. '+t.name); lines.push('   -> '+state.picks[t.id]); });
      }
      return {text:lines.join('\n'), open:open.length, picked:picked.length, checks:hand.length, hand:hand,
        said:[picked.length?picked.length+' of '+open.length+' answered':'', hand.length?plural(hand.length,'task','tasks')+' checked by hand':''].filter(Boolean).join(', ')};
    }

    /* What moved since this viewer last marked the map as seen, across however many updates
       happened in between. The first visit only records a baseline. */
    var SEEN = 'project-map-seen:'+(D.project||'')+':'+location.pathname;
    function snapshot(){
      var s = {version:U.version||null, status:{}, answer:{}};
      TASKS.concat(PARTS).forEach(function(o){ s.status[o.id] = o.status; });
      DECS.forEach(function(d){ s.answer[d.id] = d.answer || null; });
      return s;
    }
    function markSeen(){ seenVersion = U.version||null; try{ localStorage.setItem(SEEN, JSON.stringify(snapshot())); }catch(x){ /* remembering is a convenience only */ } }
    /* The rules tasks added, changed or removed. The panel shows those newer than the version this
       viewer last marked as seen; the earlier ones stay in the data, one click away. */
    var RULES = (D.settings && D.settings.rules === false) ? [] : arr(D.rules);
    var seenVersion = null;
    function freshRules(){ return seenVersion===null ? [] : RULES.filter(function(r){ return typeof r.version==='number' && r.version > seenVersion; }); }
    var since = [], sinceFrom = null;
    if(dataFile==='map-data.js'){
      try{
        var seen = JSON.parse(localStorage.getItem(SEEN) || 'null');
        if(!seen) markSeen();
        else seenVersion = seen.version;
        if(seen && seen.version !== (U.version||null)){
          sinceFrom = seen.version;
          TASKS.concat(PARTS).forEach(function(o){
            var was = seen.status[o.id];
            if(was !== o.status) since.push({id:o.id, text: was ? LABEL[was]+' → '+LABEL[o.status] : 'New, '+LABEL[o.status].toLowerCase()});
          });
          DECS.forEach(function(d){
            if(d.answer && !seen.answer[d.id]) since.push({id:d.id, text:'Answered: '+d.answer});
            else if(!(d.id in seen.answer)) since.push({id:d.id, text:'New decision'});
          });
          if(!since.length && !freshRules().length) markSeen();
        }
      }catch(x){ since = []; if(seenVersion===null) seenVersion = U.version||null; }
    }

    var ICON = {
      chev:'<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>',
      x:'<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
      copy:'<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-2a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/></svg>',
      wait:'<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.1"/><path d="M8 4.6V8l2.3 1.6"/></svg>',
      tree:'<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2 14.2 13H1.8z"/><path d="M8 6.6v3.1M8 11.3v.1"/></svg>',
      ok:'<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.4l3.2 3.2L13 4.6"/></svg>',
      q:'<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.1"/><path d="M6.3 6.4a1.8 1.8 0 1 1 2.6 1.6c-.6.3-.9.7-.9 1.3M8 11.4v.1"/></svg>'
    };
    function glyph(s){
      var inner = {
        'done':'<circle class="fill" cx="8" cy="8" r="7"/><path class="cut" d="M4.9 8.3l2.1 2.1 4.2-4.5"/>',
        'unchecked':'<circle cx="8" cy="8" r="6.1"/><path d="M5.2 8.3l1.9 1.9 3.7-4"/>',
        'in-progress':'<circle cx="8" cy="8" r="6.1"/><path class="fill" d="M8 1.9a6.1 6.1 0 0 1 0 12.2z"/>',
        'not-started':'<circle cx="8" cy="8" r="6.1"/>',
        'stuck':'<rect class="fill" x="1.5" y="1.5" width="13" height="13" rx="2.5"/><path class="cut" d="M5 8h6"/>'
      }[s] || '<circle cx="8" cy="8" r="6.1"/>';
      return '<span class="g '+e(s==='unchecked'?'done':s)+'"><svg class="i" viewBox="0 0 16 16" aria-hidden="true">'+inner+'</svg></span>';
    }
    /* Done says the work exists. Whether it works is a separate fact, so a done task says when no check backs it,
       in words and with a hollow tick where a checked one has a solid one. */
    function unchecked(t){return t.status==='done' && !arr(t.verified).length;}
    function taskLabel(t){return unchecked(t) ? 'Done, not checked' : LABEL[t.status];}
    function taskGlyph(t){return glyph(unchecked(t) ? 'unchecked' : t.status);}
    function stat(s, label){return '<span class="stat">'+glyph(s)+(label||LABEL[s])+'</span>';}
    function shown(o){return o.label || o.id;}
    /* What to call an item where nothing else names it: a label or a short id such as T3, else its name, never an id like plan-c19. */
    function called(o){return o.label || (/^[A-Za-z]{1,3}\d{1,4}$/.test(o.id) ? o.id : o.name || o.question || o.id);}
    function ref(id){
      var it = byId[id]; if(!it) return '<span class="mono">'+e(id)+'</span>';
      var g = it.o.status ? (it.type==='task' ? taskGlyph(it.o) : glyph(it.o.status)) : '';
      var name = it.o.name || it.o.short || it.o.question || '';
      return '<button class="ref" data-ref="'+e(id)+'" aria-label="Open '+e(shown(it.o))+': '+e(name)+(it.o.status?', '+(it.type==='task'?taskLabel(it.o):LABEL[it.o.status]).toLowerCase():'')+'">'+g+e(shown(it.o))+'</button>';
    }
    function refs(a){a=arr(a);return a.length?a.map(ref).join(''):'<span>nothing</span>';}
    function task(id){return (byId[id]&&byId[id].type==='task')?byId[id].o:{id:id,name:id,status:'not-started',work:[]};}
    function isDone(id){return task(id).status==='done';}

    var grouped = {};
    MILES.forEach(function(m){arr(m.tasks).forEach(function(t){grouped[t]=1;});});
    var loose = TASKS.filter(function(t){return !grouped[t.id];}).map(function(t){return t.id;});
    var next = MILES.filter(function(m){return arr(m.tasks).some(function(t){return !isDone(t);});})[0];
    var left = next ? arr(next.tasks).filter(function(t){return !isDone(t);}) : [];
    var nextIdx = next ? MILES.indexOf(next)+1 : 0;
    var openDecs = DECS.filter(function(d){return !d.answer;});

    function matches(status, ids){
      if(!state.filter) return true;
      if(state.filter==='left') return arr(ids).some(function(i){return left.indexOf(i)>-1;});
      return status===state.filter;
    }
    /* Wide enough for a milestone's tag and tally to share a line under its name. */
    /* A milestone with nothing left is one line until it is opened, so the open work is what the eye meets.
       The line still says how many of its tasks no check backs. */
    function strip(name, tag, id, ids){
      var done = ids.filter(isDone).length, unproven = ids.filter(function(i){return unchecked(task(i));}).length;
      var finished = !!id && ids.length>0 && done===ids.length, shut = finished && !state.openMs[id];
      var head = (shut?glyph(unproven?'unchecked':'done'):'')+'<b>'+e(name)+'</b>'+(tag?'<span class="tag">'+tag+'</span>':'')
        + '<span class="tally num">'+done+' of '+ids.length+' done'+(shut&&unproven?', '+unproven+' not checked':'')+'</span>';
      var h = '<div class="ms'+(shut?' shut':'')+'"><div class="ms-top">'
        + (id?'<button class="ms-head" data-ref="'+e(id)+'">'+head+'</button>':'<div class="ms-head">'+head+'</div>')
        + (finished?'<button class="count ms-toggle" data-ms="'+e(id)+'" aria-expanded="'+!shut+'">'+(shut?'Show '+plural(ids.length,'task','tasks'):'Hide tasks')+'</button>':'')
        + '</div>';
      if(shut) return h + '</div>';
      h += '<div class="slots">';
      ids.forEach(function(tid){
        var t = task(tid);
        h += '<button class="slot '+t.status+(unchecked(t)?' unchecked':'')+(matches(t.status,[tid])?'':' dim')+'" data-ref="'+e(tid)+'" title="'+e(t.name)+'">'
          + '<span class="sid"><span>'+e(shown(t))+'</span>'+taskGlyph(t)+'</span>'
          + '<span class="sname">'+e(t.name)+'</span><span class="sstat">'+taskLabel(t)+'</span></button>';
      });
      return h + '</div></div>';
    }
    function ruleRow(r, withTask){
      var gone = r.change==='removed', file = function(path){ return e(String(path||'').split('/').pop()); };
      var where = gone
        ? 'Removed'+(r.commit?' in <span class="mono">'+e(r.commit)+'</span>':'')+(r.file?' &middot; was in <span class="mono" title="'+e(r.file)+'">'+file(r.file)+'</span>':'')
        : '<span class="mono">'+e(r.fn||'')+'</span> &middot; <span class="mono" title="'+e(r.at)+'">'+file(r.at)+'</span>';
      return '<div class="rrow" data-rule="'+e(r.id)+'"><div><span class="badge '+(gone?'gone':r.change==='changed'?'wait':'new')+'">'+(gone?'Removed':r.change==='changed'?'Changed':'New')+'</span></div><div>'
        + '<p class="rtext">'+e(r.rule||'')+'</p>'
        + (r.change==='changed'&&r.was?'<p class="rwas">Before: '+e(r.was)+'</p>':'')
        + '<p class="rat">'+where+(withTask&&r.task&&byId[r.task]?' '+ref(r.task):'')+(r.inferred?' <span class="badge" title="The map is not sure that this is a rule">Inferred</span>':'')+'</p>'
        + (gone?'':'<p class="rat">'+(r.test?'Test: <span class="mono">'+e(r.test)+'</span>':'No test found')+'</p>')
        + (arr(r.usedBy).length?'<p class="rat">Also used by: '+arr(r.usedBy).map(function(c){return '<span class="mono" title="'+e(c.at)+'">'+e(c.fn)+'</span>';}).join(', ')+'</p>':'')
        + '</div></div>';
    }
    function fileRows(files){
      return arr(files).map(function(f){
        return '<div class="frow"><span class="mono">'+e(f.path)+'</span><span class="k">'+e(f.kind||'')+'</span>'
          + '<span class="a">'+(f.added?'+'+f.added:'')+'</span><span class="r">'+(f.removed?'&minus;'+f.removed:'')+'</span></div>';
      }).join('');
    }

    function render(){
      var h = '';
      var plan = D.plan;
      h += '<header class="top"><span class="name">'+e(D.project||'Project')+' <span>project map</span></span>'
        + '<span class="sum">'+e(D.summary||'')+'</span>'
        + '<span class="push">'+(U.first?'First version':'Version '+e(U.version||''))+(U.readAtShort||U.readAt?' &middot; read '+e(U.readAtShort||U.readAt):'')
        + (U.commit?' &middot; at <span class="mono">'+e(U.commit)+'</span>':'')+(U.uncommittedWork?' plus uncommitted work':'')+'</span>'
        + (plan&&plan.approval?'<span class="badge '+(plan.approval==='approved'?'ok':'wait')+'">'+(plan.approval==='approved'?'Plan approved':'Plan awaiting your response')+'</span>':'')
        + (plan&&plan.file?'<a href="'+href(plan.file)+'">Open the plan</a>':'')+'</header>';

      var fresh = freshRules();
      if(since.length || fresh.length){
        h += '<section class="paste" id="since"><p class="msg"><b>Since you last looked</b>'+(sinceFrom?' (version '+e(sinceFrom)+' to '+e(U.version||'')+')':'')+'</p><ul class="ev">'
          + since.map(function(c){ var it = byId[c.id]; return '<li>'+ref(c.id)+' '+e(it.o.name||it.o.question||'')+': '+e(c.text)+'</li>'; }).join('')
          + (fresh.length?'<li>'+plural(fresh.length,'rule','rules')+' changed: <a href="#rules">see Rules</a></li>':'')
          + '</ul><div class="row"><button class="btn quiet" id="seen">Mark as seen</button></div></section>';
      }
      h += '<section class="lead"><div>';
      if(next){
        h += '<h1><button class="count num" id="count" aria-label="Show the '+left.length+' items left before milestone '+nextIdx+'">'+plural(left.length,'item','items')+' left</button> before '+e(lowerFirst(next.name))+'</h1>'
          + '<p class="sub">That is milestone '+nextIdx+' of '+MILES.length+(next.proposed?', proposed and waiting for your edit':'')+'. Still open: '
          + left.map(function(i){return ref(i)+' '+e(task(i).name);}).join(', ')+'. '+e(U.changedNote||'')+'</p>';
      } else if(MILES.length){
        h += '<h1>Every milestone is reached</h1><p class="sub">'+e(U.changedNote||'')+'</p>';
      } else {
        h += '<h1>No milestones yet</h1><p class="sub">Name the milestones in map-data.js, or ask Claude to propose them. '+e(U.changedNote||'')+'</p>';
      }
      var nx = D.next || {};
      h += '</div><div class="next"><p class="kicker">Suggested next step</p><h2>'+e(nx.step||'Nothing suggested')+'</h2>'+(nx.reason?'<p>'+e(nx.reason)+'</p>':'')
        + (nx.open&&byId[nx.open]?'<button class="btn" data-ref="'+e(nx.open)+'" data-keep="1">Open '+e(called(byId[nx.open].o))+ICON.chev+'</button>':'')+'</div></section>';

      if(TASKS.length){
        /* When every milestone is proposed, the page says so once, not on each. */
        var allProposed = MILES.length>0 && MILES.every(function(m){return m.proposed;});
        h += '<section class="sheet" aria-label="Tasks by milestone">';
        if(allProposed) h += '<p class="meta ms-note">Claude proposed these milestones from the README and the history. Tell Claude if they are right, or edit them in map-data.js.</p>';
        MILES.forEach(function(m,i){ h += strip(m.name, 'Milestone '+(i+1)+(m.proposed&&!allProposed?', proposed':''), m.id, arr(m.tasks)); });
        if(loose.length) h += strip('Not in a milestone', '', null, loose);
        h += '</section>';
      }

      var C = arr(D.commits), UN = D.unassigned, SC = D.scope, P = arr(D.panels);
      var leftCol = '', rightCol = '';
      if(C.length){
        leftCol += '<section><div class="sec-head"><h2>What has been committed</h2><span class="hint">'+e(U.pushNote||'')+'</span></div>';
        C.forEach(function(c){
          leftCol += '<div class="crow">'+(c.hash?(c.url?'<a class="mono" href="'+href(c.url)+'">'+e(c.hash)+'</a>':'<span class="mono">'+e(c.hash)+'</span>'):'<span class="un">Not committed</span>')
            + '<span class="when num">'+e(c.date||'')+'</span><span class="subj">'+e(c.subject||'')+(c.taskNote?' <span class="meta">('+e(c.taskNote)+')</span>':'')+'</span>'
            + '<span class="cref">'+(c.task?ref(c.task):'')+'</span></div>';
        });
        leftCol += '</section>';
      }
      P.forEach(function(p){
        var body = '';
        if(p.kind==='table'){
          body = '<div class="tblwrap"><table class="grid"><thead><tr>'+arr(p.columns).map(function(c){return '<th>'+e(c)+'</th>';}).join('')+'</tr></thead><tbody>'
            + arr(p.rows).map(function(r){return '<tr>'+arr(r).map(function(c){return '<td>'+(byId[c]?ref(c):e(c))+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
        } else {
          body = arr(p.items).map(function(f){
            return '<div class="find"><h3>'+e(f.title)+'</h3>'+(f.text?'<p>'+e(f.text)+'</p>':'')+(arr(f.refs).length?'<div class="refs">'+arr(f.refs).map(ref).join('')+'</div>':'')+'</div>';
          }).join('');
        }
        leftCol += '<section><div class="sec-head"><h2>'+e(p.title)+'</h2>'+(p.hint?'<span class="hint">'+e(p.hint)+'</span>':'')+'</div>'+body+'</section>';
      });
      if(UN && arr(UN.files).length){
        rightCol += '<section><div class="sec-head"><h2>Uncommitted, not tied to a task</h2></div>'+fileRows(UN.files)+(UN.note?'<p class="meta" style="padding:0 10px">'+e(UN.note)+'</p>':'')+'</section>';
      }
      if(SC && arr(SC.items).length){
        rightCol += '<section><div class="sec-head"><h2>'+e(SC.title||'Not changing')+'</h2></div><div class="scope"><ul>'
          + arr(SC.items).map(function(s){return '<li>'+e(s)+'</li>';}).join('')+'</ul><p>'+e(SC.note||'Never counted as work left.')+'</p></div></section>';
      }

      h += '<div class="main"><div class="stack" id="col-main"><section id="parts"><div class="sec-head"><h2>Parts</h2><span class="hint">'+plural(PARTS.length,'part','parts')+', '+plural(TASKS.length,'task','tasks')+'</span>'
        + '<div class="legend" role="group" aria-label="Filter by status">';
      ORDER.forEach(function(s){
        var n = PARTS.filter(function(p){return p.status===s;}).length;
        h += '<button class="chip" data-filter="'+s+'" aria-pressed="'+(state.filter===s)+'">'+glyph(s)+LABEL[s]+' <span class="n num">'+n+'</span></button>';
      });
      h += '</div></div>';
      if(state.filter){
        h += '<div class="filterbar"><span>'+(state.filter==='left'
          ? 'Showing the parts that hold the '+plural(left.length,'item','items')+' left before milestone '+nextIdx+'.'
          : 'Showing only parts that are '+LABEL[state.filter].toLowerCase()+'.')+'</span><button data-filter="">Show everything</button></div>';
      }
      var vis = PARTS.filter(function(p){return matches(p.status,p.tasks);});
      vis.forEach(function(p){
        var wait = p.waitingShort || p.waitingOn;
        h += '<div class="prow" data-row="'+e(p.id)+'"><div class="c-stat">'+stat(p.status)+'</div>'
          + '<div class="c-main"><button class="pname" data-ref="'+e(p.id)+'">'+e(p.name)+ICON.chev+'</button>'
          + (changed.indexOf(p.id)>-1?' <span class="badge new">Changed</span>':'')
          + '<p class="preason">'+e(p.reason||'')+'</p>'
          + (p.status==='stuck'?'<p class="pwait">'+ICON.wait+'<span>Waiting on: '+e(wait||'not stated')+'</span></p>':'')
          + '</div><div class="pside"><div class="ptasks">'+arr(p.tasks).map(ref).join('')+'</div>'
          + (p.tests?'<div class="ptests">'+e(p.tests)+'</div>':'')+'</div></div>';
      });
      if(!vis.length) h += '<p class="empty">'+(PARTS.length?'No part matches this filter. <button class="count" data-filter="">Show everything</button>':'No parts have been mapped yet.')+'</p>';
      h += '</section>';
      if(RULES.length){
        var listed = state.earlier ? RULES : fresh, earlier = RULES.length - fresh.length;
        h += '<section id="rules"><div class="sec-head"><h2>Rules</h2><span class="hint">'+(fresh.length?plural(fresh.length,'rule','rules')+' changed':'None changed')+' since you last looked</span></div>';
        PARTS.concat([null]).forEach(function(p){
          var mine = listed.filter(function(r){ return p ? r.part===p.id : !(byId[r.part]&&byId[r.part].type==='part'); });
          if(mine.length) h += '<h3 class="rgroup">'+e(p?p.name:'Not in a part')+'</h3>'+mine.map(function(r){return ruleRow(r,true);}).join('');
        });
        if(earlier) h += '<p class="meta" style="padding:0 10px"><button class="count" id="earlier" aria-expanded="'+state.earlier+'">'+(state.earlier?'Show only what changed':'Show the '+plural(earlier,'earlier rule','earlier rules'))+'</button></p>';
        h += '</section>';
      }
      h += leftCol+'</div>';

      h += '<div class="stack col-side" id="col-side"><section><div class="sec-head"><h2>Decisions for you</h2><span class="hint">'+openDecs.length+' open</span></div>';
      DECS.forEach(function(d){
        var pick = state.picks[d.id], line;
        if(d.answer) line = 'Answered: <b>'+e(d.answer)+'</b>.';
        else if(d.readOnly) line = 'Proposed, not confirmed: <b>'+e(d['default']||'no default')+'</b>. Answer it in the plan.';
        else if(pick) line = 'You picked <b>'+e(pick)+'</b>. Not saved until you paste it to Claude.';
        else line = 'If you do not answer: <b>'+e(d['default']||'no default')+'</b>.';
        var w = arr(d.waiting);
        h += '<button class="dec" data-ref="'+e(d.id)+'"><span class="q">'+ICON.q+'<span>'+e(d.question)+'</span></span>'
          + '<span class="d">'+line+(w.length?' Waiting on it: '+w.map(function(x){return e(shown(task(x)));}).join(', ')+'.':'')+'</span></button>';
      });
      if(!DECS.length) h += '<p class="empty">Nothing needs your call right now.</p>';
      h += '</section>';
      var CH = arr(D.checks);
      if(CH.length){
        h += '<section><div class="sec-head"><h2>Checks run</h2><span class="hint">The commands listed in checks.json</span></div><ul class="ev">'
          + CH.map(function(c){ var bad = c.result==='failed';
              return '<li'+(bad?' class="failed"':'')+'>'+(bad?ICON.x:ICON.ok)+'<span><b>'+(bad?'Failed: ':'Passed: ')+e(c.name)+'.</b> '+e(c.summary||'')+(c.at?' <span class="mono">at '+e(c.at)+'</span>':'')+'</span></li>'; }).join('')
          + '</ul></section>';
      }
      var F = arr(D.findings);
      if(F.length){
        h += '<section><div class="sec-head"><h2>Worth a look</h2><span class="hint">Found while reading, not fixed</span></div>';
        F.forEach(function(f){
          h += '<div class="find"><h3>'+e(f.title)+'</h3><p>'+e(f.text)+'</p>'+(arr(f.refs).length?'<div class="refs">'+arr(f.refs).map(ref).join('')+'</div>':'')+'</div>';
        });
        h += '</section>';
      }
      var DD = arr(D.decided);
      if(DD.length){
        h += '<section><div class="sec-head"><h2>Already decided</h2><span class="hint">'+DD.length+' settled</span></div>';
        DD.forEach(function(x){ h += '<div class="find"><h3>'+e(x.question)+'</h3><p>'+e(x.answer)+(x.source?' <span class="meta">('+e(x.source)+')</span>':'')+'</p></div>'; });
        h += '</section>';
      }
      h += rightCol+'</div></div>';

      h += '<p class="foot">Statuses are judged from the code, the tests and the commit history'+(U.readAt?' as read on '+e(U.readAt):'')+'. '
        + (U.testsRun?'':'The map did not run the tests. ')
        + 'This page draws itself from map-data.js in the same folder, and reloads when that file changes. To change a milestone or a wording, edit that file.'
        + (U.previous?' <a href="?data='+encodeURIComponent(U.previous)+'">See the previous version</a>.':'')
        + (dataFile!=='map-data.js'?' You are looking at an earlier version. <a href="'+e(location.pathname.split('/').pop())+'">Back to the current map</a>.':'')+'</p>';

      /* One button that stays in view: what is still to answer, then where to copy it from. */
      var A = answers(), toAnswer = A.open - A.picked;
      if(A.open || A.checks){
        h += '<button class="review" id="review" data-ref="'+ANSWERS+'" data-keep="1">'
          + (toAnswer ? '<span class="num">'+toAnswer+'</span> to answer' : ICON.copy+'Copy your answers')+'</button>';
      }

      page.innerHTML = h;
      mark();
    }

    function mark(){
      document.querySelectorAll('.is-selected').forEach(function(n){n.classList.remove('is-selected');});
      if(!state.sel) return;
      var id = String(state.sel).replace(/"/g,'\\"');
      document.querySelectorAll('[data-ref="'+id+'"]:not([data-keep]),[data-row="'+id+'"]').forEach(function(n){n.classList.add('is-selected');});
    }

    function record(w){
      var h = '<div class="rec">', cs = arr(w.commits);
      if(w.state==='uncommitted'){
        h += '<div class="state un">'+ICON.tree+'<span><b>Not committed.</b> This work exists only in the working tree.</span></div>';
      } else {
        h += '<div class="state co">'+ICON.ok+'<span><b>Committed</b> '+cs.map(function(c){
            return (c.url?'<a class="mono" href="'+href(c.url)+'">'+e(c.hash)+'</a>':'<span class="mono">'+e(c.hash)+'</span>')+(c.date?' on '+e(c.date):'');}).join(', ')
          + '. '+e(w.pushedNote||(w.pushed?'Pushed.':'Not pushed.'))+'</span></div>';
      }
      h += '<p class="desc">'+e(w.description||'')+'</p>';
      if(arr(w.files).length){
        h += '<table class="files"><tbody>';
        arr(w.files).forEach(function(f){
          h += '<tr><td class="mono">'+e(f.path)+(f.note?'<small>'+e(f.note)+'</small>':'')+'</td><td class="k">'+e(f.kind||'')+'</td>'
            + '<td class="a">'+(f.added?'+'+f.added:'')+'</td><td class="r">'+(f.removed?'&minus;'+f.removed:'')+'</td></tr>';
        });
        h += '</tbody></table>';
      }
      h += '<p class="meta">'+(w.inferred?'Link to this task is inferred. ':'')+e(w.link||'')+(U.readAt?' Read at '+e(U.readAt)+'.':'')+'</p></div>';
      return h;
    }

    function answersSheet(close){
      var A = answers(), open = DECS.filter(answerable), inPlan = DECS.filter(function(d){return !d.answer && d.readOnly;});
      var h = '<div class="dhead"><div><h2>Your answers</h2></div>'+close+'</div>'
        + '<p class="t">This page cannot save itself. Copy your answers and paste them to Claude once; the next update of the map records them.</p>';
      if(open.length || inPlan.length){
        h += '<h3>Decisions</h3>';
        open.forEach(function(d){
          var pick = state.picks[d.id];
          h += '<button class="arow" data-ref="'+e(d.id)+'"><span class="aq">'+e(d.question)+'</span>'
            + (pick?'<span class="badge new">Your pick</span><span class="aa"><b>'+e(pick)+'</b></span>'
                   :'<span class="badge">Not answered</span><span class="aa">The default stands: '+e(d['default']||'no default')+'</span>')+'</button>';
        });
        inPlan.forEach(function(d){
          h += '<button class="arow" data-ref="'+e(d.id)+'"><span class="aq">'+e(d.question)+'</span><span class="badge wait">In the plan</span>'
            + '<span class="aa">Answer it in the plan, not here. Proposed: '+e(d['default']||'no default')+'</span></button>';
        });
      }
      if(A.hand.length){
        h += '<h3>Checked by hand</h3>';
        A.hand.forEach(function(t){
          h += '<button class="arow" data-ref="'+e(t.id)+'"><span class="aq">'+e(t.name)+'</span><span class="badge '+(state.picks[t.id]==='failed'?'gone':'ok')+'">'+HAND[state.picks[t.id]]+'</span></button>';
        });
      }
      if(A.picked || A.checks){
        h += '<h3>Paste this to Claude</h3><div class="paste" id="answers"><p class="msg"><b>'+A.said+'.</b></p>'
          + '<code id="line">'+e(A.text)+'</code><div class="row"><button class="btn" id="copy">'+ICON.copy+'Copy answers</button>'
          + '<button class="btn quiet" id="clearpicks">Clear picks</button><span class="msg" id="copymsg" role="status"></span></div></div>';
      } else {
        h += '<p class="meta">Nothing to copy yet. Open a decision above and pick an answer.</p>';
      }
      return h;
    }
    function detail(id){
      var it = byId[id], o = it.o, h = '';
      var close = '<button class="x" id="close" aria-label="Close details">'+ICON.x+'Close</button>';
      if(it.type==='answers') return answersSheet(close);
      if(it.type==='task'){
        h += '<div class="dhead"><div><span class="what mono">'+e(shown(o))+'</span><h2>'+e(o.name)+'</h2></div>'+close+'</div>'
          + '<div class="dstat">'+stat(o.status, taskLabel(o))+(o.part&&byId[o.part]?'<span>Part '+ref(o.part)+'</span>':'')+(o.milestone&&byId[o.milestone]?'<span>Milestone '+ref(o.milestone)+'</span>':'')+'</div>'
          + '<p class="t">'+e(o.reason||'')+'</p>';
        if(o.waitingOn) h += '<div class="wait">'+ICON.wait+'<span><b>Waiting on</b>'+e(o.waitingOn)+'</span></div>';
        var out = o.outcome || {};
        if(out.before || out.now || out.tryIt){
          h += '<dl class="kv">'+(out.before?'<dt>Before</dt><dd>'+e(out.before)+'</dd>':'')+(out.now?'<dt>Now</dt><dd>'+e(out.now)+'</dd>':'')
            + (out.tryIt?'<dt>Try it</dt><dd>'+e(out.tryIt)+'</dd>':'')+'</dl>';
        }
        var ruled = RULES.filter(function(r){return r.task===o.id;});
        if(ruled.length) h += '<h3>Rules it changed</h3><div>'+ruled.map(function(r){return ruleRow(r,false);}).join('')+'</div>';
        var checks = arr(o.verified);
        if(checks.length){
          h += '<h3>Checked</h3><ul class="ev">'+checks.map(function(c){
            return '<li>'+(c.result==='failed'?ICON.x+'<b>Failed:</b> ':ICON.ok+'<b>Passed:</b> ')+e(c.check)+(c.at?' <span class="mono">at '+e(c.at)+'</span>':'')+'</li>';
          }).join('')+'</ul>';
        } else if(o.status==='done'){
          h += '<h3>Checked</h3><div class="wait unchecked">'+ICON.q+'<span><b>No check is recorded for this task.</b>Its code is committed, which does not show that it works.</span></div>';
        } else if(o.status==='in-progress'){
          h += '<h3>Checked</h3><p class="t">No check is recorded for this task yet.</p>';
        }
        if(checkable(o)){
          var calls = arr(o.calls), mine = state.picks[o.id];
          h += '<h3>Check it by hand</h3>';
          if(calls.length){
            h += '<div class="calls" role="list" aria-label="The code this task runs through">'+calls.map(function(c){
              return '<div class="call" role="listitem"><span class="fn" style="padding-left:'+(Math.min(+c.depth||0,6)*14)+'px">'+e(c.fn)+'</span><span class="at" title="'+e(c.at)+'">'+e(String(c.at||'').split('/').pop())+'</span></div>';
            }).join('')+'</div><p class="meta">The code this task runs through, from where it starts. Use the task, then say what you saw.</p>';
          } else {
            h += '<p class="t">'+(out.tryIt?'Try it as described above, then say what you saw.':'The map does not say how to try this one. Use it the way a person would, then say what you saw.')+'</p>';
          }
          h += '<fieldset><legend class="meta" style="padding:0">What you saw</legend>';
          ['passed','failed'].forEach(function(v){
            h += '<label class="opt"><input type="radio" name="pick" value="'+v+'"'+(mine===v?' checked':'')+'><span>'+HAND[v]+'</span></label>';
          });
          h += '</fieldset>';
          h += mine
            ? '<p class="meta">Added to your answers. <button class="count" id="toanswers">Review and copy them</button> &middot; <button class="count" id="unpick">Remove this result</button></p>'
            : '<p class="meta">Your result joins your answers, to copy and paste to Claude. Claude records it against '+e(U.commit||'the commit the map was read at')+'.</p>';
        }
        h += '<h3>What changed</h3>'+(arr(o.work).length?arr(o.work).map(record).join(''):'<p class="t">Nothing yet. No commit and no uncommitted change belongs to this task.</p>');
        h += '<h3>Where it sits</h3><dl class="kv"><dt>Needs</dt><dd>'+refs(o.needs)+'</dd><dt>Unlocks</dt><dd>'+refs(o.unlocks)+'</dd>'
          + (arr(o.decisions).length?'<dt>Decision</dt><dd>'+arr(o.decisions).map(ref).join('')+'<span>depends on this</span></dd>':'')
          + '</dl>'+(D.dependencyNote?'<p class="meta">'+e(D.dependencyNote)+'</p>':'');
        if(arr(o.evidence).length) h += '<h3>Evidence</h3><ul class="ev">'+arr(o.evidence).map(function(x){return '<li>'+e(x)+'</li>';}).join('')+'</ul>';
        if(o.plan) h += '<blockquote>'+e(o.plan)+(D.plan&&D.plan.file?'<cite>'+e(shown(o))+' in <a href="'+href(D.plan.file)+'">'+e(D.plan.label||'the plan')+'</a></cite>':'')+'</blockquote>';
      } else if(it.type==='part'){
        h += '<div class="dhead"><div><span class="what">Part</span><h2>'+e(o.name)+'</h2></div>'+close+'</div>'
          + '<div class="dstat">'+stat(o.status)+(o.tests?'<span>'+e(o.tests)+'</span>':'')+(changed.indexOf(o.id)>-1?'<span class="badge new">Changed since the last update</span>':'')+'</div><p class="t">'+e(o.reason||'')+'</p>';
        if(o.waitingOn) h += '<div class="wait">'+ICON.wait+'<span><b>Waiting on</b>'+e(o.waitingOn)+'</span></div>';
        h += '<h3>Tasks in this part</h3>';
        arr(o.tasks).forEach(function(tid){var t=task(tid);
          h += '<dl class="kv"><dt>'+ref(tid)+'</dt><dd><span class="strong">'+e(t.name)+'.</span> <span>'+e(t.reason||'')+'</span></dd></dl>';
        });
        if(!arr(o.tasks).length) h += '<p class="t">No tasks are listed under this part.</p>';
        var needs=[],unl=[];
        arr(o.tasks).forEach(function(tid){var t=task(tid);
          arr(t.needs).forEach(function(n){if(o.tasks.indexOf(n)<0&&needs.indexOf(n)<0)needs.push(n);});
          arr(t.unlocks).forEach(function(n){if(o.tasks.indexOf(n)<0&&unl.indexOf(n)<0)unl.push(n);});});
        h += '<h3>Where it sits</h3><dl class="kv"><dt>Needs</dt><dd>'+refs(needs)+'</dd><dt>Unlocks</dt><dd>'+refs(unl)+'</dd></dl>'
          + '<p class="meta">Open a task to see what changed in it.</p>';
      } else if(it.type==='milestone'){
        var ids = arr(o.tasks), open = ids.filter(function(t){return !isDone(t);});
        h += '<div class="dhead"><div><span class="what">Milestone '+(MILES.indexOf(o)+1)+(o.proposed?', proposed':'')+'</span><h2>'+e(o.name)+'</h2></div>'+close+'</div>'
          + '<div class="dstat"><span class="num">'+(ids.length-open.length)+' of '+ids.length+' items done, '+open.length+' left</span></div>'
          + (o.proposed?'<p class="t"><b>Proposed.</b> Claude drew this milestone up from the README and the history. Edit it in map-data.js, or tell Claude it is right.</p>':'')
          + (o.source?'<p class="t">'+e(o.source)+'</p>':'')+'<h3>Items</h3>';
        ids.forEach(function(tid){var t=task(tid);
          h += '<dl class="kv"><dt>'+ref(tid)+'</dt><dd><span class="strong">'+e(t.name)+'.</span> <span>'+taskLabel(t)+'. '+e(t.reason||'')+'</span></dd></dl>';
        });
        var ds = DECS.filter(function(d){return !d.answer && arr(d.waiting).some(function(w){return ids.indexOf(w)>-1;});});
        h += '<h3>Open decisions that touch it</h3>'+(ds.length?'<dl class="kv">'+ds.map(function(d){return '<dt>'+ref(d.id)+'</dt><dd>'+e(d.question)+'</dd>';}).join('')+'</dl>':'<p class="t">None.</p>');
      } else if(it.type==='decision'){
        var pick = state.picks[o.id], opts = arr(o.options);
        h += '<div class="dhead"><div><span class="what">Decision '+e(shown(o))+'</span><h2>'+e(o.question)+'</h2></div>'+close+'</div>';
        if(o.answer){
          h += '<p class="t">'+(o.source?e(o.source)+'. ':'')+'Answered: <b>'+e(o.answer)+'</b>.</p>';
        } else if(o.readOnly){
          h += '<p class="t">'+(o.source?e(o.source)+'. ':'')+'The plan proposes <b>'+e(o['default']||'no default')+'</b>, and you have not confirmed it. Work that depends on it waits for you.</p>'
            + '<ul class="opts">'+opts.map(function(op){return '<li>'+e(op)+(op===o['default']?' <small>(proposed)</small>':'')+'</li>';}).join('')+'</ul>'
            + '<p class="meta">This decision belongs to the plan. Answer it there'+(o.answerIn&&o.answerIn.file?': <a href="'+href(o.answerIn.file)+'">'+e(o.answerIn.label||'open the plan')+'</a>':'')+'.</p>';
        } else {
          h += '<p class="t">'+(o.source?e(o.source)+'. ':'')+'If you do not answer, the work goes ahead on <b>'+e(o['default']||'no default')+'</b>. '+e(o.defaultNote||'')+'</p>'
            + '<fieldset><legend class="meta" style="padding:0">Pick an answer</legend>';
          opts.forEach(function(op){
            h += '<label class="opt"><input type="radio" name="pick" value="'+e(op)+'"'+(pick===op?' checked':'')+'><span>'+e(op)+(op===o['default']?'<small>Default if you do not answer</small>':'')+'</span></label>';
          });
          h += '</fieldset>';
          if(pick){
            var A = answers();
            h += '<p class="meta">Added to your answers: '+A.picked+' of '+A.open+' answered. <button class="count" id="toanswers">Review and copy them</button>'
              + ' &middot; <button class="count" id="unpick">Remove this pick</button></p>';
          } else {
            h += '<p class="meta">Your pick joins your answers, to copy and paste to Claude in one go.</p>';
          }
        }
        var w = arr(o.waiting);
        h += '<h3>Waiting on it</h3>'+(w.length?'<dl class="kv">'+w.map(function(x){return '<dt>'+ref(x)+'</dt><dd>'+e(task(x).name)+'</dd>';}).join('')+'</dl>':'<p class="t">Nothing is held up by it.</p>');
      }
      return h;
    }

    var drawer = document.getElementById('drawer'), opener = null;
    function fill(id){
      drawer.innerHTML = detail(id);
      drawer.classList.toggle('answers', id===ANSWERS);
      var title = drawer.querySelector('h2');
      if(title){ title.id = 'dtitle'; drawer.setAttribute('aria-labelledby','dtitle'); } else drawer.removeAttribute('aria-labelledby');
    }
    function select(id, instant){
      if(!id || id===state.sel || !byId[id]){
        state.sel = null; drawer.classList.remove('open','instant');
        try{history.replaceState(null,'',location.pathname+location.search);}catch(x){}
        mark(); return;
      }
      if(!state.sel) opener = document.activeElement;
      state.sel = id;
      fill(id);
      drawer.classList.toggle('instant', !!instant);
      drawer.classList.add('open'); drawer.scrollTop = 0;
      /* The details open beside the page, so a keyboard or screen reader has to be taken to them. */
      drawer.focus({preventScroll:true});
      try{history.replaceState(null,'',location.pathname+location.search+'#open='+encodeURIComponent(id));}catch(x){}
      mark();
    }
    function refreshDetail(){ var s=drawer.scrollTop; fill(state.sel); drawer.scrollTop=s; mark(); }
    function closeDetail(){
      var was = String(state.sel).replace(/"/g,'\\"'), from = opener; opener = null; select(null);
      var back = from && from.isConnected && from !== document.body ? from : document.querySelector('#page [data-ref="'+was+'"]'); if(back) back.focus();
    }

    document.addEventListener('click', function(ev){
      var t = ev.target.closest('button,input'); if(!t) return;
      if(t.id==='close'){ closeDetail(); return; }
      if(t.id==='count'){ state.filter = state.filter==='left'?null:'left'; render(); document.getElementById('parts').scrollIntoView({block:'nearest'}); return; }
      if(t.hasAttribute('data-filter')){ var f=t.getAttribute('data-filter'); state.filter = (!f||state.filter===f)?null:f; render();
        var again=document.querySelector('[data-filter="'+f+'"]'); if(again) again.focus(); return; }
      if(t.id==='copy'){ copyLine(); return; }
      if(t.name==='pick'){ state.picks[state.sel]=t.value; persist(); render(); refreshDetail(); var c=document.querySelector('input[name=pick]:checked'); if(c) c.focus(); return; }
      if(t.id==='unpick'){ delete state.picks[state.sel]; persist(); render(); refreshDetail(); var first=document.querySelector('input[name=pick]'); if(first) first.focus(); return; }
      if(t.id==='seen'){ markSeen(); since = []; render(); return; }
      if(t.hasAttribute('data-ms')){ var ms=t.getAttribute('data-ms'); state.openMs[ms] = !state.openMs[ms]; render();
        var toggle=document.querySelector('[data-ms="'+ms.replace(/"/g,'\\"')+'"]'); if(toggle) toggle.focus(); return; }
      if(t.id==='earlier'){ state.earlier = !state.earlier; render(); document.getElementById('earlier').focus(); return; }
      if(t.id==='clearpicks'){ state.picks={}; persist(); render(); refreshDetail(); drawer.focus({preventScroll:true}); return; }
      if(t.id==='toanswers'){ select(ANSWERS); var copy=document.getElementById('copy'); if(copy) copy.focus(); return; }
      var r = t.getAttribute('data-ref');
      if(r){ if(t.hasAttribute('data-keep') && state.sel===r) return; select(r); }
    });
    document.addEventListener('keydown', function(ev){ if(ev.key==='Escape' && state.sel) closeDetail(); });

    function copyLine(){
      var text = document.getElementById('line').textContent, msg = document.getElementById('copymsg'), settled = false;
      function ok(){ if(settled) return; settled=true; msg.className='msg'; msg.textContent='Copied. Paste it to Claude.'; }
      function bad(){ if(settled) return; settled=true; msg.className='msg err'; msg.textContent='Could not copy. Select the line above and copy it by hand.'; }
      function old(){ try{ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
        var done=document.execCommand('copy'); document.body.removeChild(ta); done?ok():bad(); }catch(x){bad();} }
      setTimeout(bad, 1200);
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, old); } else old();
    }

    render();
    var m = /open=([^&]+)/.exec(location.hash);
    if(m){ var want = decodeURIComponent(m[1]); if(byId[want]) select(want, true); }
  }
})();
</script>
</body>
</html>
